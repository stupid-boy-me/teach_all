seed: 0
deterministic: false

checkpoint_config:
  interval: 1
  max_keep_ckpts: 1

log_config:
  interval: 20
  hooks:
    -
      type: TextLoggerHook
    -
      type: TensorboardLoggerHook

# Per-iteration progress bar (loss / lr) on the console
custom_hooks:
  -
    type: IterProgressHook
    priority: BELOW_NORMAL

load_from: null
resume_from: null

cudnn_benchmark: false
fp16:
  loss_scale: 
    growth_interval: 2000

max_epochs: 20
runner:
  type: CustomEpochBasedRunner
  max_epochs: ${max_epochs}
